name: CI/CD Pipeline with Semantic Release

on:
  create:
    tags:
      - v*.*.*
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Determine if it’s a prerelease
        run: |
          if [[ "${{ env.VERSION }}" == *-* ]]; then
            echo "PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/musicmage-backend:${{ env.VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/musicmage-backend:latest
        if: env.PRERELEASE == 'false'

      - name: Build and Push Docker Image (Prerelease)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/musicmage-backend:${{ env.VERSION }}
        if: env.PRERELEASE == 'true'
