name: Build, Push Docker Image, and Update Changelog

on:
  push:
    branches:
      - feature/*
  pull_request:
    branches:
      - beta
      - main

jobs:
  unit-tests-and-coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: |
        dotnet restore MusicMage.Backend.sln

    - name: Run tests with coverage
      run: |
        dotnet test MusicMage.Backend.Tests/MusicMage.Backend.Tests.csproj \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults \
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

    - name: Install ReportGenerator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool

    - name: Generate coverage report
      env:
        PATH: ${{ env.PATH }}:/home/runner/.dotnet/tools
      run: |
        reportgenerator \
          -reports:./TestResults/**/*.cobertura.xml \
          -targetdir:./CoverageReport \
          -reporttypes:MarkdownSummary

    - name: Create TestsSummary directory if not exists
      run: |
        mkdir -p ./TestsSummary

    - name: Move Summary.md to TestsSummary directory
      run: |
        mv ./CoverageReport/Summary.md ./TestsSummary/testsSummary.md

    - name: Upload testsSummary.md to repository
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git pull origin main
        git add ./TestsSummary/testsSummary.md
        git commit -m "Update tests summary"
        git push origin main

    - name: Generate coverage report badges
      env:
        PATH: ${{ env.PATH }}:/home/runner/.dotnet/tools
      run: |
        reportgenerator \
          -reports:./TestResults/**/*.cobertura.xml \
          -targetdir:./CoverageReport \
          -reporttypes:Badges

    - name: Move badge to correct directory
      run: |
        mv ./CoverageReport/badge_linecoverage.svg ./TestsSummary/badge_linecoverage.svg
        mv ./CoverageReport/badge_branchcoverage.svg ./TestsSummary/badge_branchcoverage.svg

    - name: Update README.md with badges
      run: |
        sed -i '/!\[Line Coverage\]/d' README.md
        sed -i '/!\[Branch Coverage\]/d' README.md
        sed -i '/# MusicMage/a \
        \n![Line Coverage](./TestsSummary/badge_linecoverage.svg) ![Branch Coverage](./TestsSummary/badge_branchcoverage.svg)
        ' README.md

    - name: Commit changes to README
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git pull origin main
        git add README.md ./TestsSummary/badge_linecoverage.svg ./TestsSummary/badge_branchcoverage.svg
        git commit -m "Add coverage badges to README"
        git push origin main
  release:
    runs-on: ubuntu-latest
    needs: unit-tests-and-coverage
    if: github.event.pull_request.merged == true
    outputs:
      new_version: ${{ steps.semantic_release.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github

      - name: Run Semantic Release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "new_version=$(npx semantic-release --branches main | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> $GITHUB_ENV

  build-and-push:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t your-docker-repo/your-image-name:${{ env.new_version }} .
          docker push your-docker-repo/your-image-name:${{ env.new_version }}
          docker tag your-docker-repo/your-image-name:${{ env.new_version }} your-docker-repo/your-image-name:latest
          docker push your-docker-repo/your-image-name:latest
